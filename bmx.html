
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mustapha Cobbler</title>

    <style>
        body{
            font-family: Arial, sans-serif;
            background:#f4f4f4;
            margin:0;
            padding:0;
        }

        header{
            background:brown;
            color:white;
            text-align:center;

            padding:20px;
        }

        section{
            width:80%;
            margin:30px auto;
            background:white;
            padding:20px;
            border-radius:10px;
        }

        input, textarea{
            width:100%;
            padding:10px;
            margin:10px 0;
            font-size:16px;
        }

        button{
            background:brown;
            color:white;

            border:none;
            padding:10px 20px;
            font-size:18px;
            cursor:pointer;
        }

        button:hover{
            background:darkred;
        }

        footer{
            text-align:center;
            padding:20px;
            background:#222;
            color:white;
        }
    </style>
</head>

<body>

<header>
    <h1>Mustapha Cobbler</h1>
    <p>Quality Handmade Shoes</p>
</header>

<section id="contact">
    <h2>Order Form</h2>

    <form onsubmit="return submitForm()">

        <input type="text" id="name" placeholder="Full Name" required>

        <input type="tel" id="phone" placeholder="Phone Number" required>

        <input type="number" id="size" placeholder="Shoe Size" required>

        <textarea id="order" placeholder="Describe your order"></

textarea>

        <button type="submit">Order Now</button>

    </form>
</section>

<footer>
    <p>&copy; 2026 Mustapha Cobbler</p>
</footer>

<script>
function submitForm() {

    let name = document.getElementById("name").value;

    alert("Thank you, " + name + "! Your order has been received.");

    return false;
}
</script>

</body>
</html>
